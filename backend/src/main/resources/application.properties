spring.application.name=dessertrip-backend

# 개발 단계 기본 프로필. 운영은 SPRING_PROFILES_ACTIVE 로 다른 프로필을 지정한다.
# application-local.properties가 기본 프로필로 활성화됨.
spring.profiles.default=local

# ---- MySQL: 접속 값은 환경변수 또는 application-local.properties 에서 받는다 ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dessertrip}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# 지연 로딩 오류를 막기 위해: 응답 DTO 는 @Transactional 안에서 만든다
spring.jpa.open-in-view=false

# ---- JWT (비밀키는 여기에 적지 않는다) ----
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60