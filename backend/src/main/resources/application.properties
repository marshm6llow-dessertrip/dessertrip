spring.application.name=dessertrip-backend

# 개발 단계 기본 프로필. 운영은 SPRING_PROFILES_ACTIVE 로 다른 프로필을 지정한다.
# application-local.properties가 기본 프로필로 활성화됨.
spring.profiles.default=local

# ---- MySQL: 접속 값은 환경변수 또는 application-local.properties 에서 받는다 ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dessertrip}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# 지연 로딩 오류를 막기 위해: 응답 DTO 는 @Transactional 안에서 만든다
spring.jpa.open-in-view=false

# ---- JWT (비밀키는 여기에 적지 않는다) ----
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60

# ---- 이미지 업로드 (multipart/form-data) : 도감/스티커 기능 ----
# 허용 형식/파일별 최대 용량(10MB)은 common/UploadPolicy 에서 검사하고, 아래는 그보다 큰 "서버 한계선"이다.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
# 업로드 파일 저장 폴더 (코드에 경로를 박지 않고 환경변수로 바꿀 수 있게 함). 이 폴더는 GitHub 에 올리지 않는다.
app.upload-dir=${UPLOAD_DIR:uploads}
