# 이 파일을 복사해 application-local.properties 로 이름을 바꾸고 값을 채운다. (GitHub 에 올리지 않는다)
# 아래는 예시 username과 비밀번호임.
spring.datasource.username=dessertrip1
spring.datasource.password=261116

# JWT 비밀키: 32자 이상의 무작위 문자열. 터미널에서 `openssl rand -base64 48` 로 만들어 붙여 넣는다.
app.jwt.secret=여기에_무작위_비밀키

# 개발 중에는 엔티티에 맞춰 테이블을 자동으로 만든다 (운영에서는 사용 금지)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true